<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vector Line Integrals</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script defer src="math.js"></script>
  <script defer src="draw.js"></script>
  <script defer src="main.js"></script>
</head>

<body>
  <div class="layout">
    <div id="vis"></div>
    <div class="config">
      <p id="integral"></p>
      <div id="path-legend" class="legend">
        <div class="legend-bar"></div>
        <div class="legend-labels">
          <span id="legend-min"></span><span>0</span><span id="legend-max"></span>
        </div>
      </div>

      <div class="section">
        <h3>Path</h3>
        <label>
          x(t) = <input type="text" id="curve-x">
        </label>
        <label>
          y(t) = <input type="text" id="curve-y">
        </label>
        <label>
          <span>End of path: t = <span id="t-end-value"></span></span>
          <input type="range" id="t-end" min="0" max="10" step="any">
        </label>
        <label>
          <span>Samples: <span id="samples-value"></span></span>
          <input type="range" id="samples" min="1" max="1000" step="1">
        </label>
      </div>

      <div class="section">
        <h3>Path Style</h3>
        <label class="checkbox">
          <input type="radio" name="path-style" value="solid" checked>
          <span>Solid line</span>
        </label>
        <label class="checkbox">
          <input type="radio" name="path-style" value="gradient">
          <span>Color gradient</span>
        </label>
        <label class="checkbox">
          <input type="radio" name="path-style" value="area">
          <span>Shaded area</span>
        </label>
      </div>

      <div class="section">
        <h3>Animation</h3>
        <label class="checkbox">
          <span>Animate Path:</span>
          <input type="checkbox" id="animate">
        </label>
        <label>
          <span>Duration: <span id="duration-value"></span> ms</span>
          <input type="range" id="duration" min="250" max="5000" step="250">
        </label>
      </div>

      <div class="section">
        <h3>Vector Field</h3>
        <label>u(x, y) = <input type="text" id="field-u"></label>
        <label>v(x, y) = <input type="text" id="field-v"></label>
        <label>
          <span>Arrow Stepping: <span id="arrow-step-value"></span></span>
          <input type="range" id="arrow-step" min=".5" max="2" step=".5">
        </label>
      </div>

      <button id="render-button">Render</button>

    </div>
  </div>
</body>

</html>
